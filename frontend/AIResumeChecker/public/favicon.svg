<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2A1B14" />
      <stop offset="50%" stopColor="#1B120D" />
      <stop offset="100%" stopColor="#0E0A08" />
    </linearGradient>
    <linearGradient id="bb-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF9B66" />
      <stop offset="50%" stopColor="#E86A33" />
      <stop offset="100%" stopColor="#C44E1C" />
    </linearGradient>
    <linearGradient id="bb-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="rgba(255, 170, 110, 0.4)" />
      <stop offset="100%" stopColor="rgba(232, 106, 51, 0.1)" />
    </linearGradient>
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bb-bg)" stroke="url(#bb-border)" stroke-width="1.5" />
  
  <!-- Subtle inner ambient glow -->
  <circle cx="24" cy="24" r="14" fill="#E86A33" opacity="0.12" />

  <!-- Pulse / Beat Waveform & Diamond Spark -->
  <g filter="url(#bb-glow)">
    <!-- Pulse rhythm lines -->
    <path
      d="M10 24H16L19 18L24 31L29 14L32 26L35 24H38"
      stroke="url(#bb-accent)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center AI Spark / Diamond -->
    <path
      d="M24 10L26.5 16L24 22L21.5 16Z"
      fill="url(#bb-accent)"
      opacity="0.9"
    />
  </g>
</svg>